name: standard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    uses: bounded-systems/.github/.github/workflows/repo-standard.yml@99e88a0335519cb78be8a1b6623105613fa6aca1
    with:
      security: true
      test: true
      runtime: bun
      test-command: "bun install --frozen-lockfile && bun run build && bun test && bun examples/consumer-smoke.ts && bunx jsr publish --dry-run --allow-slow-types"
