name: standard
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  standard:
    uses: bounded-systems/.github/.github/workflows/repo-standard.yml@e378689a0418a095faa5aebb119d8a8abd2fc8f8
    with:
      security: true
      test: true
      runtime: bun
      test-command: "bun install --frozen-lockfile && bun run build && bun test && bun examples/consumer-smoke.ts && bunx jsr publish --dry-run --allow-slow-types"
